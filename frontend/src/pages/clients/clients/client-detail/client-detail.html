<div class="detail-page">
  <a routerLink="/clients" class="back-link">← Retour à la liste</a>

  <p *ngIf="loading">Chargement...</p>
  <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="detail-card" *ngIf="client && !loading">
    <h2>{{ client.nom }} {{ client.prenomOuRaisonSociale }}</h2>

    <div class="detail-row">
      <span class="label">Email</span>
      <span class="value">{{ client.email }}</span>
    </div>

    <div class="detail-row">
      <span class="label">Téléphone</span>
      <span class="value">{{ client.telephone }}</span>
    </div>

    <div class="detail-row">
      <span class="label">Adresse</span>
      <span class="value">{{ client.adresse || '—' }}</span>
    </div>

    <div class="detail-row">
      <span class="label">Date de création</span>
      <span class="value">{{ client.dateCreation | date:'dd/MM/yyyy HH:mm' }}</span>
    </div>
  </div>
</div>
